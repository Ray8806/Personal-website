name: Update dashboard data

on:
  schedule:
    - cron: "17 21 * * *"   # 每天 UTC 21:17（台灣 05:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Ray8806
      - name: Fetch stock closing prices
        continue-on-error: true
        run: node scripts/fetch-stocks.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json data/stocks.json
          git diff --staged --quiet || (git commit -m "chore: update dashboard data" && git push)
